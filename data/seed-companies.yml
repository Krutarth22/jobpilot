# jobpilot companies.yml — the boards `scan` fetches.
#
# Each entry is one ATS board: { name, provider, slug } where slug is the
# board token in the public API URL (jobs.ashbyhq.com/<slug>,
# boards.greenhouse.io/<slug>, jobs.lever.co/<slug>).
#
# `setup` rewrites title_filter and location_filter from your profile and
# may append companies it suggests for your domain (each checked against the
# API before being saved here). This seed is a starting point — boards that
# no longer exist are skipped by scan with a warning, never a crash.

title_filter:
  positive:
    - engineer
    - developer
    - engineering manager
    - product manager
    - designer
    - data
  negative:
    - sales
    - recruiter
    - university

location_filter: {}

companies:
