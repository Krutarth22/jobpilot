<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{NAME}} - Resume</title>
<!-- Structure only. Fonts, colors, sizes, header alignment, section order, bullets and
     contact icons come from `resume_style` in profile.md (the look of the user's own
     resume) and are added at render time. Do not add <style>, inline styles or new classes. -->
</head>
<body>
<!-- Fill every double-brace placeholder. Keep only the contact <span>s listed in
     resume_style.contact, and delete one the profile has no value for. An unfilled
     placeholder stops the build. Wrap numbers and named results in <b> only where the
     user's own resume does. Section order is set by resume_style.sections; keep every
     section the user's resume has, and omit one it doesn't. -->
<div class="page">

  <header>
    <h1>{{NAME}}</h1>
    <div class="contact">
      <span class="c-email">{{EMAIL}}</span>
      <span class="c-phone">{{PHONE}}</span>
      <span class="c-location">{{LOCATION}}</span>
      <span class="c-linkedin">{{LINKEDIN}}</span>
      <span class="c-github">{{GITHUB}}</span>
      <span class="c-website">{{WEBSITE}}</span>
    </div>
  </header>

  <section class="s-summary">
    <h2>Summary</h2>
    <p>{{SUMMARY}}</p>
  </section>

  <section class="s-experience">
    <h2>Experience</h2>
    <!-- Repeat per role; keep the most role-relevant bullets first. -->
    <div class="role">
      <div class="role-title">{{ROLE_TITLE}}</div>
      <div class="role-head">
        <span>{{COMPANY}}</span>
        <span class="role-meta">{{DATES}}, {{ROLE_LOCATION}}</span>
      </div>
      <ul>
        <li>{{BULLET}}</li>
      </ul>
    </div>
  </section>

  <section class="s-education">
    <h2>Education</h2>
    <!-- Repeat per degree. -->
    <div class="edu">
      <div class="role-title">{{DEGREE}}</div>
      <div>{{SCHOOL}} · {{SCHOOL_LOCATION}} · {{GRAD_YEAR}}</div>
    </div>
  </section>

  <section class="s-skills">
    <h2>Skills</h2>
    <div class="skills">
      <!-- One line per group, with the group names the user's resume uses. -->
      <p><b>{{SKILL_GROUP}}:</b> {{SKILLS}}</p>
    </div>
  </section>

</div>
</body>
</html>
